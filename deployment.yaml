apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-server-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting-server
  template:
    metadata:
      labels:
        app: reporting-server
    spec:
      containers:
      - name: reporting-server
        image: reporting-server:latest  # Jenkinsfile에서 sed로 동적 치환됨
        imagePullPolicy: Always         # <--- 매번 최신 태그 이미지를 강제로 강제 풀링하도록 수정
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-server-service
spec:
  type: NodePort
  selector:
    app: reporting-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080