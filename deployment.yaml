apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-server-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting-server
  template:
    metadata:
      labels:
        app: reporting-server
    spec:
      containers:
      - name: reporting-server
        image: reporting-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-server-service
spec:
  type: NodePort
  selector:
    app: reporting-server
  ports:
    - protocol: TCP
      port: 8080          # 수정: 80 -> 8080
      targetPort: 8080
      nodePort: 30080