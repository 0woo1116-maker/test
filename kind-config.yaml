kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # 1. 앱(ReportingServer) 접속을 위한 30080 포트 (유지 필수!)
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      # 2. 젠킨스 연동을 위한 6443 -> 6444 포트[cite: 2, 3]
      - containerPort: 6443
        hostPort: 6444
        protocol: TCP